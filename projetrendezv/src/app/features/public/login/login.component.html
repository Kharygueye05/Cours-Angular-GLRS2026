<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>Connexion</h1>
      <p class="subtitle">Accédez à votre tableau de bord médical</p>
    </div>

    <form #loginFom="ngForm" (ngSubmit)="onLogin()" class="login-form">
      <div class="form-group">
        <label for="login" class="form-label">
          <i class="fas fa-user"></i>
          Identifiant
        </label>
        <div class="input-with-icon">
          <i class="fas fa-envelope input-icon"></i>
          <input 
            type="text" 
            id="login" 
            class="form-input"
            name="email"
            placeholder="votre@email.com"
            required
            [(ngModel)]="userLogin.email"
          >
        </div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">
          <i class="fas fa-lock"></i>
          Mot de passe
        </label>
        <div class="input-with-icon">
          <i class="fas fa-key input-icon"></i>
          <input 
            type="password" 
            id="password" 
            class="form-input"
            name="password"
            placeholder="Votre mot de passe"
            required
            [(ngModel)]="userLogin.password"
          >
          <button type="button" class="password-toggle" id="togglePassword">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="login-btn">
        <i class="fas fa-sign-in-alt"></i>
        Se connecter
      </button>
      <div class="alternative-login">
        <p class="alternative-text">Pas encore de compte ?</p>
        <a class="register-link">
          <i class="fas fa-user-plus"></i>
          S'inscrire
        </a>
      </div>
    </form>
  </div>
</div>
